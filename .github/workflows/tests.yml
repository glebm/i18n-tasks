on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]
jobs:
  lint:
    runs-on: ubuntu-24.04

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true
          bundler: latest
          rubygems: latest

      - name: Run rubocop
        run: bundle exec rubocop --format github

  test:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        ruby-version: [
            "4.0",
            "3.4",
            "3.3",
            "3.2",
            "3.1",
            "jruby-10.1.0.0",
            "jruby-head",
            "head",
          ]
      fail-fast: false

    env:
      GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
      COVERAGE: 1
      RUBYOPT: "--enable-frozen-string-literal --debug-frozen-string-literal"
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: ${{ matrix.ruby-version != 'head' }}
          bundler: latest
          rubygems: latest
      - name: Install dependencies
        run: bundle install
      - name: Run tests
        run: mkdir -p test-results && bundle exec rake
        env:
          RSPEC_JUNIT_OUTPUT: test-results/rspec.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.ruby-version }}
          path: test-results/rspec.xml
          if-no-files-found: ignore

  test-report:
    if: always() && github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
      - name: Download test results
        uses: actions/download-artifact@v7
        with:
          pattern: test-results-*
          path: test-results
      - name: Publish test results
        run: ruby script/report_test_results.rb test-results
