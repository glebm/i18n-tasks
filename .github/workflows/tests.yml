on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true
          bundler: latest
          rubygems: latest

      - name: Run rubocop
        run: bundle exec rubocop --format github

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: [
            "4.0",
            "3.4",
            "3.3",
            "3.2",
            "3.1",
            "jruby-10.1.0.0",
            "jruby-head",
            "head",
          ]
      fail-fast: false

    env:
      GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
      COVERAGE: 1
      RUBYOPT: "--enable-frozen-string-literal --debug-frozen-string-literal"
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: ${{ matrix.ruby-version != 'head' }}
          bundler: latest
          rubygems: latest
      - name: Install dependencies
        run: bundle install
      - name: Run tests
        run: bundle exec rake 2>&1 | tee rake-output.txt
      - name: Comment test results on PR
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('rake-output.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUBY_VERSION_LABEL: ${{ matrix.ruby-version }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "<!-- i18n-tasks-test-results-$RUBY_VERSION_LABEL -->"
            echo "### Test results (Ruby $RUBY_VERSION_LABEL): $JOB_STATUS"
            echo
            echo '```'
            tail -n 60 rake-output.txt | sed 's/\x1b\[[0-9;]*m//g'
            echo '```'
          } > comment.md
          marker="<!-- i18n-tasks-test-results-$RUBY_VERSION_LABEL -->"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/${{ github.event.pull_request.number }}/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md
          else
            gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md
          fi
