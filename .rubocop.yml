inherit_from: .rubocop_todo.yml

plugins:
  - rubocop-rake
  - rubocop-rspec

inherit_gem:
  standard: config/base.yml

AllCops:
  TargetRubyVersion: 3.1
  SuggestExtensions: false
  Exclude:
    - "tmp/**/*"
    - "vendor/bundle/**/*"
    - "spec/fixtures/**/*"

RSpec/DiscardedMatcher:
  Enabled: true

RSpec/IncludeExamples:
  Enabled: true

RSpec/LeakyLocalVariable:
  Enabled: true

RSpec/MatchWithSimpleRegex:
  Enabled: true

RSpec/Output:
  Enabled: true
